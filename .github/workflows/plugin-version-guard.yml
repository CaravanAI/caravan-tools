name: Plugin version guard

# Uses a VENDORED standalone copy of the guard (see
# .github/actions/plugin-version-guard). Canonical source lives in
# CaravanAI/caravan-plugins; cross-repo resolution of a private subpath
# action returns "not found" even with permissive settings, so we vendor.
# Runs on every PR (no path filter) so it's safe as a required status check.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-version-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/plugin-version-guard
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          marketplace-check: warn
